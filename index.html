<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For You ❤️</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: radial-gradient(circle at center, #2b0918 0%, #0d0208 100%);
      overflow: hidden;
      font-family: 'Poppins', sans-serif;
    }
    .container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
    }
    canvas {
      max-width: 92vw;
      filter: drop-shadow(0 0 18px rgba(255, 30, 86, 0.65));
      transition: transform 0.3s ease;
    }
    .pulse {
      animation: heartbeat 1.4s infinite ease-in-out;
    }
    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14% { transform: scale(1.07); }
      28% { transform: scale(1); }
      42% { transform: scale(1.05); }
      70% { transform: scale(1); }
    }
    .message {
      margin-top: -15px;
      font-family: 'Great Vibes', cursive;
      font-size: 3.4rem;
      color: #ffccd5;
      text-shadow: 0 0 15px rgba(255, 77, 109, 0.9), 0 0 30px rgba(255, 30, 86, 0.6);
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 1.2s ease, transform 1.2s ease;
    }
    .message.show {
      opacity: 1;
      transform: translateY(0);
    }
    .floating-heart {
      position: absolute;
      bottom: -30px;
      color: rgba(255, 77, 109, 0.25);
      animation: floatUp linear infinite;
      pointer-events: none;
      z-index: 1;
    }
    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 0.6; }
      100% { transform: translateY(-110vh) scale(1.3); opacity: 0; }
    }
  </style>
</head>
<body>

  <div class="container">
    <canvas id="heartCanvas" width="380" height="360"></canvas>
    <div id="loveText" class="message">I Love You</div>
  </div>

  <script>
    const canvas = document.getElementById("heartCanvas");
    const ctx = canvas.getContext("2d");
    const loveText = document.getElementById("loveText");

    // Break every line into small 1-pixel steps so the animation never skips the end
    let x = 190, y = 265;
    let angle = 0;
    const points = [{ x, y }];

    function left(deg) { angle -= deg; }
    function right(deg) { angle += deg; }
    function forward(dist) {
      const rad = (angle * Math.PI) / 180;
      for (let s = 0; s < dist; s++) {
        x += Math.cos(rad);
        y += Math.sin(rad);
        points.push({ x, y });
      }
    }

    // Build complete closed heart path
    left(140);
    forward(113);
    for (let i = 0; i < 200; i++) { right(1); forward(1); }
    left(120);
    for (let i = 0; i < 200; i++) { right(1); forward(1); }
    forward(113);
    points.push({ x: points[0].x, y: points[0].y }); // Snap exact closure

    // Time-based animation: takes ~4.5 seconds regardless of screen refresh rate
    const drawDuration = 4500;
    let startTime = null;
    let fillAlpha = 0;

    function animate(timestamp) {
      if (!startTime) startTime = timestamp;
      const elapsed = timestamp - startTime;
      const progress = Math.min(elapsed / drawDuration, 1);
      const currentIndex = Math.floor(progress * (points.length - 1));

      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Draw outline up to current progress
      ctx.beginPath();
      ctx.moveTo(points[0].x, points[0].y);
      for (let i = 1; i <= currentIndex; i++) {
        ctx.lineTo(points[i].x, points[i].y);
      }

      if (progress < 1) {
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.strokeStyle = "#ff2a5f";
        ctx.lineWidth = 4;
        ctx.stroke();

        // Glowing pen tip spark
        const tip = points[currentIndex];
        ctx.beginPath();
        ctx.arc(tip.x, tip.y, 5, 0, Math.PI * 2);
        ctx.fillStyle = "#ffffff";
        ctx.fill();

        requestAnimationFrame(animate);
      } else {
        // Closed path with smooth gradient fill
        ctx.closePath();
        const grad = ctx.createLinearGradient(100, 60, 280, 280);
        grad.addColorStop(0, "#ff4d6d");
        grad.addColorStop(0.5, "#e01e37");
        grad.addColorStop(1, "#800f2f");

        fillAlpha = Math.min(fillAlpha + 0.04, 1);
        ctx.save();
        ctx.globalAlpha = fillAlpha;
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.restore();

        ctx.strokeStyle = "#ff758f";
        ctx.lineWidth = 3;
        ctx.stroke();

        if (fillAlpha < 1) {
          requestAnimationFrame(animate);
        } else {
          canvas.classList.add("pulse");
          loveText.classList.add("show");
        }
      }
    }

    requestAnimationFrame(animate);

    // Subtle floating hearts in background
    function createFloatingHeart() {
      const heart = document.createElement("div");
      heart.classList.add("floating-heart");
      heart.innerHTML = "❤";
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.fontSize = (Math.random() * 16 + 12) + "px";
      heart.style.animationDuration = (Math.random() * 5 + 6) + "s";
      document.body.appendChild(heart);
      setTimeout(() => heart.remove(), 11000);
    }
    setInterval(createFloatingHeart, 700);
  </script>
</body>
</html>
